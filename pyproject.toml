[project]
name = "rag-architectures-playbook"
version = "0.1.0"
description = "Hands-on benchmark & implementation of RAG architectures using Qdrant, Gemini, LangGraph, Ragas, and Arize Phoenix."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "flashrank>=0.2.9",
    "networkx>=3.3",
    "ragas>=0.2.0",
    "arize-phoenix>=5.0.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "anthropic>=1.17.0",
    "langchain-anthropic>=1.7.10",
]
